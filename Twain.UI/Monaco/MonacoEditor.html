<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Twain Monaco Editor</title>

    <style>
        html,
        body,
        #editor {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="editor"></div>

    <script src="Assets/vs/loader.js"></script>

    <script>
        let editor;
        let suppressTextChanged = false;

        require.config({
            paths: {
                vs: "Assets/vs"
            }
        });

        require(
            ["vs/editor/editor.main"],
            function () {
                editor =
                    monaco.editor.create(
                        document.getElementById("editor"),
                        {
                            value: "",
                            language: "plaintext",
                            automaticLayout: true
                        });

                editor.onDidChangeModelContent(
                    function () {
                        if (suppressTextChanged) {
                            return;
                        }

                        invokeCSharpAction(
                            JSON.stringify({
                                type: "textChanged",
                                text: editor.getValue()
                            }));
                    });

                invokeCSharpAction(
                    JSON.stringify({
                        type: "ready"
                    }));
            });

        window.twainEditor = {
            setText:
                function (text) {
                    if (!editor) {
                        return;
                    }

                    suppressTextChanged = true;

                    try {
                        editor.setValue(
                            text ?? "");
                    }
                    finally {
                        suppressTextChanged = false;
                    }
                },

            getText:
                function () {
                    if (!editor) {
                        return "";
                    }

                    return editor.getValue();
                }
        };
    </script>
</body>
</html>
