<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Twain Monaco Editor</title>

    <style>
        html,
        body,
        #editor {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="editor"></div>

    <script src="Assets/vs/loader.js"></script>

    <script>
        require.config({
            paths: {
                vs: "Assets/vs"
            }
        });

        require(
            ["vs/editor/editor.main"],
            function () {
                monaco.editor.create(
                    document.getElementById("editor"),
                    {
                        value:
                            "Monaco editor is running in Twain.",
                        language: "plaintext",
                        automaticLayout: true
                    });
            });
    </script>
</body>
</html>
