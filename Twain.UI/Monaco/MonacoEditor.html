<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Twain Monaco Editor</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #editor {
            width: 100%;
            height: 100%;
        }

        #status {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 1000;
            padding: 4px 8px;
            background: white;
            color: black;
            font-family: sans-serif;
            font-size: 13px;
        }
    </style>

    <script>
        window.onerror =
            function (
                message,
                source,
                line,
                column,
                error) {

                const status =
                    document.getElementById("status");

                if (status) {
                    status.textContent =
                        "JavaScript error: " +
                        message;
                }
            };
    </script>
</head>

<body>
    <div id="status">
        Monaco HTML loaded.
    </div>

    <div id="editor"></div>

    <script src="Assets/vs/loader.js"></script>

    <script>
        const status =
            document.getElementById("status");

        status.textContent =
            "Monaco loader loaded.";

        require.config({
            paths: {
                vs: "Assets/vs"
            }
        });

        require(
            ["vs/editor/editor.main"],
            function () {
                monaco.editor.create(
                    document.getElementById("editor"),
                    {
                        value:
                            "Monaco editor is running in Twain.",
                        language: "plaintext",
                        automaticLayout: true
                    });

                status.remove();
            },
            function (error) {
                status.textContent =
                    "Monaco load failed: " +
                    error;
            });
    </script>
</body>
</html>
